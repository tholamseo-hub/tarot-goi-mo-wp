name: Validate and deploy Tarot Goi Mo theme

on:
  push:
    branches: [main]
    paths:
      - "themes/tarot-goi-mo/**"
      - ".github/workflows/deploy-wordpress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarot-goi-mo-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          find themes/tarot-goi-mo -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Validate Major Arcana count
        run: |
          php -r 'define("ABSPATH", __DIR__ . "/"); $cards = include "themes/tarot-goi-mo/assets/data/major-arcana.php"; if (!is_array($cards) || count($cards) !== 22) { fwrite(STDERR, "Expected 22 cards, got ".(is_array($cards) ? count($cards) : 0).PHP_EOL); exit(1); } echo "Major Arcana data OK: 22 cards".PHP_EOL;'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PATH: ${{ secrets.SSH_PATH }}
    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SSH_HOST" && -n "$SSH_USERNAME" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_PATH" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SSH deployment secrets are not configured yet. Validation passed; deployment intentionally skipped."
          fi

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH key
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/github_tarot_deploy
          chmod 600 ~/.ssh/github_tarot_deploy
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/github_tarot_deploy -p "$PORT" -o BatchMode=yes "$SSH_USERNAME@$SSH_HOST" "echo 'SSH connection OK'"

      - name: Deploy theme over SSH
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/github_tarot_deploy -p $PORT" \
            themes/tarot-goi-mo/ \
            "$SSH_USERNAME@$SSH_HOST:$SSH_PATH"
