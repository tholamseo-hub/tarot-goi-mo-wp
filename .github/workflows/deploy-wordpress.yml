name: Validate and deploy Tarot Goi Mo theme

on:
  push:
    branches: [main]
    paths:
      - "themes/tarot-goi-mo/**"
      - ".github/workflows/deploy-wordpress.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarot-goi-mo-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          find themes/tarot-goi-mo -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Validate Major Arcana count
        run: |
          php -r 'define("ABSPATH", __DIR__ . "/"); $cards = include "themes/tarot-goi-mo/assets/data/major-arcana.php"; if (!is_array($cards) || count($cards) !== 22) { fwrite(STDERR, "Expected 22 cards, got ".(is_array($cards) ? count($cards) : 0).PHP_EOL); exit(1); } echo "Major Arcana data OK: 22 cards".PHP_EOL;'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$FTP_HOST" && -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "FTPS deployment secrets are not configured yet. Validation passed; deployment intentionally skipped."
          fi

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install lftp
        if: steps.config.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Test explicit FTPS connection
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          PORT="${FTP_PORT:-21}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$PORT" "ftp://$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 2;
            cls -la;
            bye
          "

      - name: Deploy theme over explicit FTPS
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          PORT="${FTP_PORT:-21}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$PORT" "ftp://$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 2;
            mirror -R --delete --verbose themes/tarot-goi-mo/ /;
            bye
          "
